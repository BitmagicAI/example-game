name: Deploy to GitHub Pages

# Builds the game with the open engine (the npm package @bitmagicai/aitopia) and deploys it to
# GitHub Pages. Manual while the repository is private (Pages serves a free organization's public
# repositories only); add `push: branches: [main]` here when it goes public.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # The engine and its files are on GitHub Packages while in testing; drop these two lines
          # once they are public on npm as @bitmagic/aitopia and @bitmagic/engine-assets.
          registry-url: https://npm.pkg.github.com
          scope: '@bitmagicai'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx aitopia build site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
