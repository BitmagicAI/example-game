name: Deploy to GitHub Pages

# Builds the game with the open engine (the npm package @bitmagicai/aitopia) and deploys it to
# GitHub Pages. Manual for now: the engine's own files (the `--engine-assets` folder) are not
# published yet. Once they are, drop that flag and add `push: branches: [main]` here.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # The engine is on GitHub Packages while in testing; drop these two lines once it is
          # public on npm as @bitmagic/aitopia.
          registry-url: https://npm.pkg.github.com
          scope: '@bitmagicai'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx aitopia build site --engine-assets engine-assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
