<!-- Trick or Roll PICK YOUR ROLLER (styles). Static on purpose: it paints with the HTML, before the game bundle runs, and doubles as the loading screen. -->
<!-- The font is its own element: the game's menus, HUD and panels use it too ('TOR Lilita' first in their font stacks), so it stays when the screen below is dropped. It also means the
     iOS app, which has no network, draws the real face instead of a fallback. -->
<style id="tor-font-style">
%%FONT%%
</style>
<style id="tor-rs-style">
#tor-rs {
    --ink: #1b0e26; --cream: #fff6dc; --gold: #ffd27a; --orange: #ff8a1f; --violet: #4a2670; --mute: #d9c4f5;

    --hh: clamp(52px, calc(var(--vh) * 14), 130px); --bh: clamp(46px, calc(var(--vh) * 9), 74px); --fh: clamp(64px, calc(var(--vh) * 12), 112px);
    --lbl: clamp(28px, calc(var(--vh) * 5.2), 46px);
    --cols: 4; --rows: 1;
    --avail: calc(var(--vh) * 100 - 20px - var(--hh) - var(--bh) - var(--fh) - 3 * var(--gv) - 14px);
    --side: 56px;
    --cw: min(calc((100vw - var(--side) - (var(--cols) - 1) * var(--g)) / var(--cols)), calc(((var(--avail) - (var(--rows) - 1) * var(--g)) / var(--rows) - 10px) * .75 + 10px), calc(var(--vh) * 44), 420px);
    position: fixed; inset: 0; z-index: 9500; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gv);
    padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    color: var(--cream); background: #1b0d3a;
    font-family: 'TOR Lilita', 'Lilita One', 'Arial Rounded MT Bold', 'Arial Black', system-ui, sans-serif; font-weight: 400;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: opacity .3s ease;
}
@supports (height: 100dvh) { #tor-rs { --vh: 1dvh; } }
@media (max-aspect-ratio: 9/10) { #tor-rs { --cols: 2; --rows: 2; --side: 40px; --hh: clamp(52px, calc(var(--vh) * 8.5), 74px); --bh: clamp(46px, calc(var(--vh) * 8), 66px); --fh: 116px; } }

    #tor-rs { --bh: 40px; --hh: 40px; --fh: 64px; --gv: 6px; }

    background: radial-gradient(90% 60% at 50% 108%, rgba(255, 138, 74, .55), rgba(255, 138, 74, 0) 70%), linear-gradient(180deg, #170a33 0%, #33195c 34%, #6a2f86 64%, #b8508a 88%, #ff9a5a 100%); }

<!-- Trick or Roll PICK YOUR ROLLER: the first screen. Meet the rollers (a card only SELECTS it and shows its line) while the game loads behind it; the ROLL button (Enter / Space, gamepad A)
     is the game's PLAY button, there is no other: as soon as everything is loaded it calls the engine's own start, engine.startGame(). ROLL while the game still loads locks the choice and
     the game starts by itself when it is ready. While you look around, the game loads behind this screen (the page fetches its menu stage as soon as the engine starts).
     ?select=0, the creator's editor, ?stage=<name> and desktop ?autostart=1 skip it (the engine's own start screen runs as before).
     ?pick=<id> selects that roller and presses ROLL once ready (harnesses); a webdriver (a headless test) presses ROLL 3 s after ready unless ?select=1.
     Game side: tor/CharacterSelect.ts, which puts this screen on the page. After a stage URL, roster or portrait change: node tools/pick-screen/build.mjs -->
<script>
/* The iOS app serves the page from bmapp:// (and has no network of its own to rely on). Two things differ there, before anything else runs:
   - the page is told to draw under the Dynamic Island, the rounded corners and the home indicator, so that env(safe-area-inset-*) reports them (the screen below and the game's own UI keep clear of them:
     tor/safeArea.ts); a browser tab letterboxes by itself and is left alone;
   - the engine's request to Google Fonts for the HUD face is dropped before it is made: the face ('TOR Lilita') is embedded above and comes first in every font stack, so the app asks nobody for anything. */
(function () {
    try {
        if (location.protocol !== 'bmapp:') return;
        var m = document.querySelector('meta[name="viewport"]');
        if (m && !/viewport-fit/.test(m.content)) m.content += ', viewport-fit=cover';
        var add = document.head.appendChild;
        document.head.appendChild = function (n) {
            if (n && n.nodeName === 'LINK' && /^https?:\/\/fonts\.(googleapis|gstatic)\.com\//.test(n.href || '')) return n;
            return add.call(this, n);
        };
    } catch (e) { /* ignore */ }
})();
</script>

<script>

    }

    var pick = IDS[0];

    var qp = q.get('pick'), manual = q.get('select') === '1';

    // automation: ?pick=<id> selects that animal and presses ROLL the moment the game is ready; a webdriver (a headless test) with neither presses ROLL 3 s after ready.
    // ?select=1 = a harness that presses ROLL itself (tools/harness.mjs openGame).
    var autoNow = !!(qp && !manual), autoLater = !!(navigator.webdriver && !qp && !manual);

    var files = {}, groupA = [], started = false;
    function file(u, w, keep) { return files[u] || (files[u] = { u: u, w: w || 300000, loaded: 0, total: w || 300000, done: false, keep: !!keep, p: null }); }

                var dv = new DataView(h.buffer);

            }
